<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="20" fill="#ffffff" />
  
  <!-- Outer Frame -->
  <g fill="#0b0f19">
    <!-- Top Left Corner -->
    <rect x="20" y="20" width="50" height="50" rx="8" />
    <rect x="28" y="28" width="34" height="34" rx="4" fill="#ffffff" />
    <rect x="36" y="36" width="18" height="18" rx="2" fill="#0b0f19" />

    <!-- Top Right Corner -->
    <rect x="130" y="20" width="50" height="50" rx="8" />
    <rect x="138" y="28" width="34" height="34" rx="4" fill="#ffffff" />
    <rect x="146" y="36" width="18" height="18" rx="2" fill="#0b0f19" />

    <!-- Bottom Left Corner -->
    <rect x="20" y="130" width="50" height="50" rx="8" />
    <rect x="28" y="138" width="34" height="34" rx="4" fill="#ffffff" />
    <rect x="36" y="146" width="18" height="18" rx="2" fill="#0b0f19" />

    <!-- Data Pattern Dots -->
    <rect x="80" y="25" width="12" height="12" rx="2" />
    <rect x="98" y="35" width="12" height="12" rx="2" />
    <rect x="80" y="55" width="25" height="10" rx="2" />

    <rect x="25" y="80" width="12" height="25" rx="2" />
    <rect x="45" y="95" width="20" height="12" rx="2" />

    <rect x="80" y="80" width="40" height="40" rx="6" fill="#0284c7" />
    
    <rect x="130" y="80" width="15" height="15" rx="2" />
    <rect x="155" y="95" width="25" height="12" rx="2" />
    
    <rect x="80" y="130" width="20" height="20" rx="4" />
    <rect x="110" y="140" width="30" height="10" rx="2" />
    <rect x="150" y="130" width="30" height="50" rx="6" />
  </g>
</svg>
